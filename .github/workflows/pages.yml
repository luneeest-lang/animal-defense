name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js _site/
      # 파일 주소에 커밋 버전을 붙여, 업데이트하면 휴대폰도 바로 새 파일을 받게 한다
      - name: Cache busting
        run: node tools/cache-bust.mjs _site ${GITHUB_SHA::8}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
